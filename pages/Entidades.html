<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios Combinados</title>
    <link rel="stylesheet" href="../css/stylees.css">
</head>
<body>

  <div class="window-container">
    <div class="window-header">Entidades</div>

    <div class="main-header">
        INSTALACION ENTIDAD
    </div>

    <div class="form-box">
        <div class="form-group">
            <label>Entidad:</label>
            <select>
                <option>0006 Vicepresidencia del Estado Plurinacional</option>
                <option>0010 Ministerio de Relaciones Exteriores</option>
                <option>0015 Ministerio de Gobierno</option>
                <option>0016 Ministerio de Educación</option>
                <option>0020 Ministerio de Defensa</option>
                <option>0025 Ministerio de la Presidencia</option>
                <option>0030 Ministerio de Justicia</option>
            </select>
        </div>

        <div class="form-group">
            <label>Sigla:</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Institución:</label>
            <input type="text">
        </div>

        <div class="buttons">
            <button class="btn">OK</button>
            <button class="btn">Salir</button>
        </div>
    </div>
</div>

</body>
</html>
