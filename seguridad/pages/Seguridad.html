<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Seguridad</title>
    <link rel="stylesheet" href="../css/style8.css">
</head>

<body>

    <div class="container">

       
        <div class="top-bar">
            SEGURIDAD
        </div>

        <header>
            SEGURIDAD
        </header>

       
        <div class="contenido">

            <div class="panel">

                
                <div class="fila-superior">

                    <div class="grupo">
                        <label>USUARIO:</label>
                        <input type="text" value="admin">
                    </div>

                    <div class="grupo">
                        <label>CONTRASEÑA ASIGNADA:</label>
                        <input type="password" value="12345">
                    </div>

                </div>

                
                <div class="fila">
                    <label>NOMBRE COMPLETO:</label>
                    <input type="text" class="input-largo" value="administrador">
                </div>

                
                <div class="fila descripcion">
                    <label>DESCRIPCION:</label>
                    <textarea></textarea>
                </div>

                
                <div class="fila tipo-usuario">

                    <label>TIPO DE USUARIO:</label>

                    <div class="radios">

                        <div>
                            <input type="radio" name="tipo">
                            <span>Operador</span>
                        </div>

                        <div>
                            <input type="radio" name="tipo" checked>
                            <span>Administrador</span>
                        </div>

                    </div>

                </div>

            </div>

           
            <div class="botonera">

                <button class="btn">Primero</button>
                <button class="btn">Anterior</button>

                <button class="btn disabled" disabled>
                    Siguiente
                </button>

                <button class="btn disabled" disabled>
                    Ultimo
                </button>

                <button class="btn disabled" disabled>
                    Nuevo
                </button>

                <button class="btn activo">
                    Editar
                </button>

                <button class="btn texto">
                    Guardar
                </button>

                <button class="btn texto">
                    Deshacer
                </button>

                <a href="#" class="salir">
                    Salir
                </a>

            </div>

        </div>

    </div>

</body>

</html>
